<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#152433">
<title>重生之我是蕭老思的學生｜911 辦公室</title>
<style>
:root{
  --bg:#142230;
  --panel:#203246;
  --panel-2:#29435d;
  --line:#0a1621;
  --cream:#fff5dd;
  --gold:#f1d28d;
  --gold-2:#cfaa63;
  --sky:#98c4d0;
  --leaf:#5f866b;
  --stone:#d5c4a0;
  --muted:#aac1c5;
  --ok:#6ea583;
  --warn:#eab47a;
  --danger:#d76d6a;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--cream);font-family:ui-monospace,"Cascadia Mono","Cascadia Code","SFMono-Regular","Noto Sans TC","Microsoft JhengHei",monospace;overscroll-behavior:none}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #ffe39a;outline-offset:2px}
.pixel{image-rendering:pixelated;shape-rendering:crispEdges}
.hidden{display:none!important}
.app{height:100dvh;display:flex;align-items:center;justify-content:center;padding:14px;background:radial-gradient(circle at 50% 15%,#3a5569 0,#192737 45%,#0c141d 100%)}
.game{width:min(1160px,100%);height:min(840px,100%);position:relative;overflow:hidden;border:5px solid #0b1722;box-shadow:0 0 0 3px #b79a6c,0 18px 60px rgba(0,0,0,.45);background:#34495a}
.game::before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 25%),linear-gradient(0deg,rgba(0,0,0,.10),transparent 20%);mix-blend-mode:screen}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:block;animation:fadeIn .34s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.topbar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(180deg,rgba(14,24,34,.92),rgba(16,28,41,.85));border-bottom:3px solid var(--gold-2);backdrop-filter:blur(2px)}
.brand{font-weight:900;font-size:clamp(13px,1.8vw,21px);letter-spacing:1px;text-shadow:2px 2px 0 #09111a}
.sub{font-size:12px;color:#d9c7a3}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tool,.primary,.secondary,.choice,.close{border:2px solid #cdb584;border-radius:0;box-shadow:3px 3px 0 #0a1520;background:#38536a;color:#fff8e7;min-height:40px}
.tool{padding:6px 10px}
.tool:hover,.primary:hover,.secondary:hover,.choice:hover,.close:hover{transform:translateY(-1px);filter:brightness(1.05)}
.primary{padding:10px 20px;background:linear-gradient(180deg,#f4ddab,#dcc07f);color:#223245;font-weight:900;border-color:#fff0c6;box-shadow:4px 4px 0 #101926}
.primary:disabled{opacity:.6;transform:none;cursor:default}
.secondary{padding:9px 14px;background:#435e76;border-color:#abb8bd}
/* intro */
#intro{background:#91bbc7}
#intro .scene-art,#office .scene-art{position:absolute;inset:0}
#intro svg,#office svg{width:100%;height:100%;display:block}
#office .office-drawing{shape-rendering:geometricPrecision}
.intro-title{position:absolute;top:6%;left:0;right:0;z-index:5;text-align:center;padding:0 10px;font-size:clamp(26px,5.1vw,58px);font-weight:900;letter-spacing:3px;color:#fff0c7;text-shadow:0 4px 0 #314757,0 8px 0 rgba(26,42,53,.75)}
.intro-title small{display:block;margin-bottom:12px;font-size:clamp(12px,1.9vw,18px);letter-spacing:4px;color:#ffdf9e;text-shadow:0 2px 0 #314757}
.intro-box{position:absolute;left:50%;bottom:9.5%;transform:translate(-50%,26px);z-index:6;width:min(720px,92%);background:rgba(23,37,50,.95);border:4px solid #f3d999;box-shadow:0 0 0 3px #152433,8px 8px 0 rgba(7,16,24,.8);padding:22px 24px 20px;text-align:center;opacity:0;animation:introRise .9s .55s forwards}
@keyframes introRise{to{opacity:1;transform:translate(-50%,0)}}
.intro-box p{margin:0 0 18px;line-height:1.9;font-size:clamp(15px,2.1vw,22px)}
/* office */
#office{background:#324c54}
.office-ui{position:absolute;inset:0;z-index:4;pointer-events:none}
.hud{position:absolute;top:68px;left:14px;pointer-events:auto;background:rgba(23,36,50,.9);border:3px solid #e1c488;box-shadow:3px 3px 0 rgba(8,15,23,.85);padding:10px 12px;min-width:196px}
.hud strong{display:block;font-size:14px;margin-bottom:4px}
.hud .hint{font-size:11px;color:#cfd6d4}
.progress{display:flex;gap:5px;margin-top:8px}
.pip{width:18px;height:11px;border:1px solid #d9c49d;background:#425061}
.pip.fill{background:linear-gradient(180deg,#9fd7b2,#68a17f)}
.instruction{position:absolute;right:14px;bottom:14px;max-width:64%;pointer-events:auto;background:rgba(18,31,44,.88);border:2px solid #c8aa77;color:#fcf2da;padding:7px 11px;font-size:12px;text-align:right;box-shadow:3px 3px 0 rgba(8,15,23,.75)}
.sprite-layer{position:absolute;inset:0;z-index:5;pointer-events:none}
.sprite{position:absolute;display:block;filter:blur(.65px) drop-shadow(2px 4px 2px rgba(0,0,0,.20));opacity:.97}
.sprite svg{width:100%;height:100%;display:block;image-rendering:auto;shape-rendering:geometricPrecision}
.item-icon{position:absolute;display:block;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.20));pointer-events:none}
.item-icon svg{width:100%;height:100%;display:block}
.hotspot{position:absolute;z-index:8;background:transparent;border:2px solid transparent;border-radius:6px;min-width:42px;min-height:42px;touch-action:manipulation;transition:all .14s ease}
.hotspot:hover,.hotspot:focus-visible{background:rgba(255,239,181,.14);border-color:#ffe6a7;box-shadow:0 0 0 2px rgba(0,0,0,.22),0 0 18px rgba(255,230,167,.35)}
.hotspot:active{background:rgba(255,239,181,.2)}
.hotspot.done:not(.npc)::after{content:'✓';position:absolute;top:4px;right:4px;padding:0 4px;font-size:12px;border:1px solid #fff3cb;background:#5f8f74;color:#fff}
.hotspot .tip{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-5px);white-space:nowrap;font-size:12px;color:#233245;background:#ffe7ac;border:2px solid #765a3e;padding:4px 6px;opacity:0;pointer-events:none;transition:opacity .12s ease}
.hotspot:hover .tip,.hotspot:focus-visible .tip{opacity:1}
.hotspot .check{display:none;position:absolute;top:-22px;left:50%;transform:translateX(-50%);min-width:30px;height:30px;line-height:24px;text-align:center;font-size:22px;font-weight:900;background:#5a9071;color:#fff;border:3px solid #f7e3ab;box-shadow:2px 2px 0 #122030}
.hotspot.done .check{display:block}
.hotspot.door-open{animation:doorPulse 1.3s infinite;border-color:#f6df9e}
@keyframes doorPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,225,160,.35)}50%{box-shadow:0 0 0 3px rgba(255,225,160,.18),0 0 18px rgba(255,225,160,.28)}}
/* lunch reward on window-side round table */
.lunch-display{position:absolute;z-index:9;left:64%;top:24%;width:8%;height:10%;pointer-events:none;filter:drop-shadow(3px 4px 0 rgba(0,0,0,.23));animation:mealArrive .35s steps(3,end) both}
.lunch-display svg{width:100%;height:100%}
.steam{position:absolute;bottom:74%;width:5px;height:20px;background:linear-gradient(0deg,transparent,#fffaf0 35%,#e1f7ee 75%,transparent);opacity:0;animation:steamRise 2s linear infinite}
.steam-one{left:30%}.steam-two{left:53%;animation-delay:.55s}.steam-three{left:70%;animation-delay:1.1s}
@keyframes steamRise{0%{transform:translateY(10px);opacity:0}25%{opacity:.8}75%{opacity:.52}100%{transform:translateY(-26px);opacity:0}}
@keyframes mealArrive{from{transform:scale(.6);opacity:.3}to{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.steam{animation:none;opacity:.65;transform:translateY(-8px)}}
/* dialog */
.modal-wrap{position:absolute;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;padding:16px 16px 22px;background:rgba(7,14,25,.45)}
.modal-wrap.show{display:flex}
.modal{position:relative;width:min(840px,100%);max-height:min(78%,560px);overflow:auto;background:linear-gradient(180deg,#22364a,#203247);border:4px solid #f0d89b;box-shadow:0 0 0 3px #132131,8px 8px 0 rgba(6,12,20,.82);padding:18px 20px 18px}
.modal-header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:8px;border-bottom:2px dashed #7f97a1;color:#f4dfab}
.modal-header strong{font-size:20px}
.close{min-width:40px;height:36px;background:#445a72;border-color:#b5a280}
.dialog-text{margin:18px 0 14px;min-height:74px;line-height:1.9;font-size:clamp(16px,2.1vw,22px);white-space:pre-wrap}
.skip{background:transparent;border:0;color:#c7d6d9;text-decoration:underline;padding:4px 0;font-size:12px}
.choices{display:grid;gap:9px}
.choice{text-align:left;line-height:1.7;padding:9px 12px;background:linear-gradient(180deg,#3a5670,#314b63);border-color:#b8c3c1}
.dialog-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.dialog-portrait{display:none;position:absolute;right:22px;bottom:100%;width:118px;height:140px;pointer-events:none}
.modal-wrap.npc-dialog .dialog-portrait{display:block}
.dialog-portrait svg{width:100%;height:100%;display:block;image-rendering:auto;shape-rendering:geometricPrecision;filter:blur(.45px) drop-shadow(3px 4px 2px rgba(0,0,0,.3))}
/* ending */
#ending:not(.active){display:none}
#ending{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 38%,#4a6168,#1a2a3d 70%)}
.ending-wrap{width:min(760px,94%);padding:28px 20px 30px;border:4px solid #f0d694;background:rgba(23,36,50,.9);box-shadow:0 0 0 3px #11202e,8px 8px 0 rgba(8,14,21,.78)}
.stars{font-size:clamp(34px,7vw,68px);letter-spacing:10px;color:#f7d989;text-shadow:0 4px 0 #243a50;animation:twinkle 1.9s infinite alternate}
@keyframes twinkle{to{opacity:.5;transform:translateY(-2px)}}
#ending .sub{font-size:13px;letter-spacing:2px;margin-top:3px}
#ending h1{margin:10px 0 10px;font-size:clamp(28px,5.2vw,52px);line-height:1.3;color:#ffe7a5;text-shadow:0 4px 0 #22384d}
#ending p{margin:0 0 20px;font-size:clamp(16px,2.3vw,24px);line-height:1.8}
.end-note{display:none;margin-top:16px;font-size:22px;font-weight:900;color:#e7d6ab;border:3px double #d8bb7b;padding:12px 16px}
.end-note.show{display:block}
.tagline{margin-top:14px;font-size:11px;color:#d5c3a18f}
/* responsive */
@media(max-width:740px){
  .app{padding:0}
  .game{width:100%;height:100dvh;border:0;box-shadow:none}
  .topbar{padding:calc(env(safe-area-inset-top) + 8px) 10px 8px}
  .brand{font-size:13px}
  .sub{font-size:10px}
  .tool{padding:5px 7px;font-size:12px;min-height:34px}
  .intro-title{top:5%;font-size:clamp(25px,7.5vw,38px)}
  .intro-box{bottom:11%;padding:16px 14px}
  .hud{top:56px;left:8px;min-width:0;padding:7px 8px}
  .hud strong{font-size:11px}
  .hud .hint{font-size:10px}
  .pip{width:12px;height:7px}
  .instruction{right:8px;bottom:8px;max-width:76%;padding:5px 7px;font-size:10px}
  .modal-wrap{padding:10px 8px max(12px,env(safe-area-inset-bottom))}
  .modal{padding:12px 13px 14px;max-height:76%;border-width:3px}
  .modal-header strong{font-size:17px}
  .dialog-text{min-height:68px;margin:14px 0 11px}
  .dialog-portrait{right:4px;width:78px;height:96px}
  .hotspot .tip{display:none}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<main class="game" aria-label="重生之我是蕭老思的學生互動遊戲">

<section class="screen active" id="intro">

      </g>
      <!-- clouds -->
      <g fill="#d5edf3" opacity=".85">
        <rect x="112" y="100" width="110" height="28"/><rect x="140" y="84" width="66" height="22"/>
        <rect x="708" y="112" width="124" height="28"/><rect x="742" y="92" width="58" height="22"/>
      </g>
    </svg>
  </div>
  <div class="intro-title"><small>NCCU 911 OFFICE STORY</small>重生之我是蕭老思的學生</div>
  <div class="intro-box">
    <p>重生你是蕭老思的學生，<br>今天是普通的上學日，你如往常前往 911 辦公室。</p>
    <button class="primary" id="startBtn">進入 911 辦公室</button>
  </div>
</section>

<section class="screen" id="office">
  <div class="topbar">
    <div>
      <div class="brand">《重生之我是蕭老思的學生》</div>
      <div class="sub">911 辦公室｜與 NPC 對話、準備上課道具、完成完美日常</div>
    </div>
    <div class="tools">
      <button class="tool" id="questBtn">任務 0/6</button>
      <button class="tool" id="muteBtn">♫ 音效</button>
    </div>
  </div>

  <div class="scene-art" aria-hidden="true">
    <svg viewBox="0 0 1000 720" class="office-drawing" preserveAspectRatio="xMidYMid meet">
      <defs>
        <pattern id="softTiles" width="54" height="54" patternUnits="userSpaceOnUse"><rect width="54" height="54" fill="#d9c7a8"/><path d="M0 53H54M53 0V54" stroke="#cbb592" stroke-width="2"/></pattern>

      <circle cx="88" cy="238" r="3" fill="#958268"/><circle cx="88" cy="327" r="3" fill="#958268"/>

      <!-- 右側白板 -->
      <rect x="949" y="180" width="42" height="345" fill="#f2f5ef" stroke="#91a8aa" stroke-width="7"/>

  </div>

  <div class="sprite-layer" aria-hidden="true">
    <!-- Kajie - muted blazer, fine gold glasses, shoulder length silver hair -->
    <div class="sprite" style="left:23.3%;top:24%;width:12.5%;height:26%;">

  computer:{name:'老師的電腦',desc:'老思上課前需要學生幫忙佈置設備，需要閉眼就能裝好',required:true,action:'準備電腦'},

  nameplates:{name:'櫃子裡的名牌',desc:'質性研究學生們的名牌，需要先佈置',required:true,action:'拿取名牌'},
  snacks:{name:'零食',desc:'蕭老思學生的精神糧食',required:false}

const state={lunch:{started:false,teacherResponse:null,selectedMeal:null,spice:null,toppings:null,completed:false,servedMeal:null,errorVisible:false},scene:'intro',muted:false,teacherFinalSaid:false,npcDone:{kajie:false,teacher:false},itemDone:{cup:false,computer:false,nameplates:false},dialogOpen:false};

let audioCtx=null,typingTimer=null,typing=false,typingFull='',typingAfter=null;

function beep(kind='tap'){
  if(state.muted) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    const now=audioCtx.currentTime;
    osc.type = kind==='typing' ? 'square' : kind==='win' ? 'triangle' : 'square';
    osc.frequency.value = kind==='typing' ? 430 : kind==='win' ? 660 : 510;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(kind==='typing'?0.013:0.04, now+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + (kind==='win'?0.22:0.07));
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + (kind==='win'?0.23:0.08));
  }catch(err){}
}

function showScene(id){
  document.querySelectorAll('.screen').forEach(el=>el.classList.toggle('active',el.id===id));
  state.scene=id;
}
function progressCount(){
  return Object.values(state.npcDone).filter(Boolean).length + Object.values(state.itemDone).filter(Boolean).length + Number(state.lunch.completed);
}
function coreDone(){return progressCount()===6}
function canExit(){return coreDone() && state.teacherFinalSaid}
function updateUI(){
  const n=progressCount();
  $('hudText').textContent=`課前準備 ${n} / 6`;
  $('questBtn').textContent=`任務 ${n}/6`;
  $('pips').innerHTML = Array.from({length:6}, (_,i)=>`<span class="pip ${i<n?'fill':''}"></span>`).join('');
  document.querySelectorAll('.hotspot').forEach(el=>{
    const {kind,id}=el.dataset;
    if(kind==='npc') el.classList.toggle('done', !!state.npcDone[id]);
    if(kind==='item' && state.itemDone[id]) el.classList.add('done');
    if(kind==='door') el.classList.toggle('door-open', canExit());
  });
  $('lunchDisplay').classList.toggle('hidden', !state.lunch.servedMeal);
  $('lunchDisplay').setAttribute('aria-label',state.lunch.servedMeal==='gengdawangSet'?'焿大王套餐，冒著熱氣':'素食粥，冒著熱氣');
  $('instruction').textContent = canExit() ? '出口已開放！點擊右下角的門離開辦公室。' : coreDone() ? '東西都準備好了！再去找一次蕭老思。' : '點擊人物與道具，也別忘了詢問老師今天的午餐。';
}

function clearTyping(){ if(typingTimer){ clearInterval(typingTimer); typingTimer=null; } typing=false; }
function finishTyping(){
  if(!typing) return;
  clearTyping();
  dialogText.textContent=typingFull;
  skipBtn.classList.add('hidden');
  if(typingAfter){ const cb=typingAfter; typingAfter=null; cb(); }
}
function typeText(text, after){
  clearTyping();
  typingFull=text; typingAfter=after||null;
  dialogText.textContent=''; choices.innerHTML=''; dialogActions.innerHTML='';
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ dialogText.textContent=text; skipBtn.classList.add('hidden'); if(typingAfter){ const cb=typingAfter; typingAfter=null; cb(); } return; }
  skipBtn.classList.remove('hidden');
  const chars=Array.from(text); let i=0; typing=true;
  typingTimer=setInterval(()=>{
    i++; dialogText.textContent = chars.slice(0,i).join('');
    if(i%3===0) beep('typing');
    if(i>=chars.length) finishTyping();
  }, 32);
}
function addButton(label, fn, cls='primary', target=dialogActions){
  const b=document.createElement('button'); b.className=cls; b.textContent=label; b.addEventListener('click', ()=>{beep(); fn();}); target.appendChild(b); return b;
}

  if(id==='kajie'){
    return `<svg viewBox="0 0 120 140" class="pixel"><rect x="38" y="8" width="36" height="10" fill="#d9d7d2"/><rect x="28" y="18" width="56" height="14" fill="#f0efea"/><rect x="20" y="32" width="72" height="18" fill="#f2f1ec"/><rect x="22" y="46" width="68" height="18" fill="#f4eadb"/><rect x="26" y="60" width="60" height="28" fill="#f4eadb"/><rect x="34" y="70" width="10" height="8" fill="#4b382c"/><rect x="74" y="70" width="10" height="8" fill="#4b382c"/><rect x="28" y="68" width="18" height="4" fill="#cda866"/><rect x="72" y="68" width="18" height="4" fill="#cda866"/><rect x="48" y="80" width="14" height="4" fill="#8d6251"/><rect x="18" y="92" width="84" height="38" fill="#71889d"/></svg>`;
  }
  return '';
}
function openDialog(title,type,id=''){
  modal.classList.add('show'); state.dialogOpen=true;
  modal.classList.toggle('npc-dialog', type==='npc');
  dialogName.textContent=title;
  portrait.innerHTML = type==='npc' ? getPortraitSVG(id) : '';

}
function closeDialog(){
  clearTyping();
  modal.classList.remove('show','npc-dialog');
  skipBtn.classList.add('hidden');
  state.dialogOpen=false;
  updateUI();
}
function npcDialog(id){
  const npc=NPC[id];
  openDialog(npc.name,'npc',id);
  if(id==='teacher' && state.npcDone.teacher && coreDone() && !state.teacherFinalSaid){
    typeText('好，東西都準備好了，準備上課。', ()=>{
      addButton('好的，老師！', ()=>{ state.teacherFinalSaid=true; closeDialog(); beep('win'); });
    });
    return;
  }
  if(state.npcDone[id]){
    if(id==='teacher' && !state.lunch.completed){
      typeText(npc.repeat, ()=>{
        addButton('老師今天要吃什麼？', lunchDialog);
        addButton('先不打擾老師', closeDialog,'secondary');
      });
    } else {
      typeText(npc.repeat, ()=> addButton('結束對話', closeDialog));
    }
    return;
  }
  typeText(npc.intro, ()=>{
    npc.options.forEach((opt,i)=>{
      addButton(`${'ABC'[i]}. ${opt}`, ()=>{
        typeText(npc.replies[i], ()=>{
          addButton('結束對話', ()=>{ state.npcDone[id]=true; closeDialog(); beep('win'); });
        });
      }, 'choice', choices);
    });
  });
}
function lunchDialog(){
  // A stable result: random draw only once when the explicit lunch topic is first selected.
  const l=state.lunch;
  if(!l.started){
    l.started=true;
    const possible=['busy','usual','different'];
    l.teacherResponse=possible[Math.floor(Math.random()*possible.length)];
  }
  openDialog('蕭老思 · 今天的午餐','npc','teacher');
  const lines={busy:'太忙了吃不了',usual:'跟過往一樣',different:'換個口味'};
  typeText(lines[l.teacherResponse],()=>{
    if(l.teacherResponse==='busy'){
      l.completed=true;l.servedMeal=null;
      updateUI();
      addButton('了解，老師先忙',()=>{closeDialog();beep('win')});
    }else if(l.teacherResponse==='usual'){
      addButton('開始選擇餐點', lunchMealChoices);
    }else{
      addButton('開始選擇餐點', lunchDifferentChoices);
    }
  });
}
function lunchComplete(meal){
  const l=state.lunch;
  l.completed=true;l.servedMeal=meal;l.errorVisible=false;
  updateUI();beep('win');
  typeText(meal==='gengdawangSet'?'焿大王套餐準備好了！窗邊的圓桌飄起熱騰騰的香氣。':'素食粥（不加辣、不加配料）準備好了！窗邊的圓桌冒出熱氣。',()=>{
    addButton('返回辦公室',closeDialog);
  });
}
function lunchError(back){
  state.lunch.errorVisible=true;
  typeText('選錯了，重新選擇',()=>addButton('重新選擇',back));
}
function lunchMealChoices(){
  typeText('請選擇老師今天的午餐。',()=>{
    addButton('焿大王套餐',()=>{state.lunch.selectedMeal='gengdawangSet';lunchComplete('gengdawangSet')},'choice',choices);
    addButton('其他餐點',()=>{state.lunch.selectedMeal='other';lunchError(lunchMealChoices)},'choice',choices);
  });
}
function lunchDifferentChoices(){
  state.lunch.selectedMeal=null;state.lunch.spice=null;state.lunch.toppings=null;
  lunchPickMeal();
}
function lunchPickMeal(){
  typeText('老師今天想換個口味。先選餐點：',()=>{
    addButton('焿大王之外的素食粥',()=>{state.lunch.selectedMeal='vegetarianPorridge';lunchPickSpice()},'choice',choices);
    addButton('其他餐點',()=>{state.lunch.selectedMeal='other';lunchError(lunchDifferentChoices)},'choice',choices);
  });
}
function lunchPickSpice(){
  typeText('素食粥要加辣嗎？',()=>{
    addButton('不加辣',()=>{state.lunch.spice='none';lunchPickToppings()},'choice',choices);
    addButton('加辣',()=>{state.lunch.spice='spicy';lunchError(lunchDifferentChoices)},'choice',choices);
  });
}
function lunchPickToppings(){
  typeText('素食粥需要加配料嗎？',()=>{
    addButton('不加配料',()=>{state.lunch.toppings='none';if(state.lunch.selectedMeal==='vegetarianPorridge'&&state.lunch.spice==='none')lunchComplete('vegetarianPorridge');else lunchError(lunchDifferentChoices)},'choice',choices);
    addButton('加配料',()=>{state.lunch.toppings='added';lunchError(lunchDifferentChoices)},'choice',choices);
  });
}
function itemDialog(id){
  const item=ITEMS[id];
  openDialog(item.name,'item',id);
  typeText(item.desc, ()=>{
    if(item.required && !state.itemDone[id]) addButton(item.action, ()=>{ state.itemDone[id]=true; closeDialog(); beep('win'); });
    else if(item.required) addButton('已準備完成 ✓', closeDialog, 'secondary');
    addButton('關閉', closeDialog, 'secondary');
  });
}
function questDialog(){
  openDialog('課前準備任務','quest');
  const lines=[
    ['與卡姐對話', state.npcDone.kajie],
    ['與蕭老思對話', state.npcDone.teacher],
    ['拿取老師的杯子', state.itemDone.cup],
    ['準備老師的電腦', state.itemDone.computer],
    ['取得學生名牌', state.itemDone.nameplates],
    ['詢問並完成老師午餐',state.lunch.completed]
  ].map(([t,done])=>`${done?'✓':'□'} ${t}`).join('\n');
  typeText(lines, ()=> addButton('返回辦公室', closeDialog));
}
function doorDialog(){
  if(canExit()) { beep('win'); showScene('ending'); return; }
  openDialog('辦公室出口','door');
  const msg = coreDone() ? '出門前，還需要聽蕭老思宣布上課。' : '好像還有上課前的事情沒有完成。';
  typeText(msg, ()=> addButton('繼續準備', closeDialog));
}

// events
  document.querySelectorAll('.hotspot').forEach(btn=>btn.addEventListener('click', ()=>{
    if(state.dialogOpen) return;
    beep();
    const kind=btn.dataset.kind, id=btn.dataset.id;
    if(kind==='npc') npcDialog(id);
    else if(kind==='item') itemDialog(id);
    else doorDialog();
  }));
  $('startBtn').addEventListener('click', ()=>{ beep(); showScene('office'); updateUI(); });
  $('questBtn').addEventListener('click', ()=>{ beep(); questDialog(); });
  $('muteBtn').addEventListener('click', ()=>{ state.muted=!state.muted; $('muteBtn').textContent = state.muted ? '♪ 靜音' : '♫ 音效'; if(!state.muted) beep(); });
  $('closeDialog').addEventListener('click', ()=>{ beep(); closeDialog(); });
  skipBtn.addEventListener('click', ()=>{ beep(); finishTyping(); });
  dialogText.addEventListener('click', finishTyping);
  $('byeBtn').addEventListener('click', ()=>{ beep('win'); $('byeBtn').classList.add('hidden'); $('endNote').classList.add('show'); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && state.dialogOpen) closeDialog(); });
  updateUI();
})();
</script>
</body>
</html>
